description: >-
  East West Bancorp publishes no API of its own; the group's API surface is the Bridge Open
  Banking program run by its banking subsidiary, East West Bank. Searched that program's
  entire anonymous surface on 2026-09-14 — the developer portal home, All APIs, Products,
  How It Works, FAQs, Support, Release Notes, Authorization API page and the full
  /sitemap.xml route list — and found no published rate limit, quota, burst allowance or
  throttling policy, and no documented rate-limit response headers. This replaces an earlier
  bulk-sweep artifact that asserted a 429/503 response-code posture nobody had verified;
  those unverified codes have been removed.
notes: >-
  An honest zero. Limits, if any exist, are set per customer during Global Transaction
  Services onboarding alongside pricing and the client certificate, and are not public.
