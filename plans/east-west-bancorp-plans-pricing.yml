description: >-
  East West Bancorp publishes no API price sheet. Its banking subsidiary, East West Bank,
  runs the Bridge Open Banking developer program, and that program's FAQ states the pricing
  posture explicitly: "There are no fees to access the Bridge Open Banking portal. If you
  wish to move to our sandbox and production environments, please contact your GTS sales
  consultant for pricing and next steps." The portal itself is free; everything callable is
  quoted by a Global Transaction Services sales consultant. There are therefore no published
  tiers, no published quotas and no published overage rates.
notes: >-
  plan_count is 0 on purpose — this is a sales-quoted enterprise program, not an omission.
  The free-portal tier below is recorded because the provider states it, but it grants
  documentation and in-browser "try it" access only, not a callable environment.
