    description: >-
      East West Bancorp's API surface is delivered by its banking subsidiary, East West Bank,
      through the Bridge Open Banking developer program for Global Transaction Services
      clients. Documented capabilities open and manage master and sub accounts — including an
      aCHTransactionsAllowed permission, Excess, Deficit and TwoWay sweeps and a pegBalance —
      retrieve account, transaction and statement information, transfer funds, and deliver
      incoming and outgoing wire push notifications carrying originator, sending and
      beneficiary country codes. Authorization is two-legged OAuth 2.0 (client_credentials)
      against an Okta token endpoint, returning a Bearer token; account opening and funds
      transfer take a client-generated GUID requestId that makes them safely replayable. The
      gateway is an Azure API Management runtime on East West Bank's own infrastructure. The
      API list, product library and reference render only after portal sign-in, and sandbox
      and production require a client certificate plus a GTS sales conversation, so no
      machine-readable contract is publicly downloadable.
