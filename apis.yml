description: >-
  East West Bancorp, Inc. (NASDAQ: EWBC) is the Pasadena, California bank holding company for
  East West Bank, a California state-chartered commercial bank and Member FDIC institution
  (NMLSR ID 469761) that specializes in cross-border U.S.-Greater China commercial banking and
  Global Transaction Services. The holding company publishes no API of its own; the group's
  entire developer surface is East West Bank's first-party "Bridge Open Banking" program at
  apiportal.eastwestbank.com, which documents APIs to open and manage master and sub accounts
  (with ACH transaction permissions and Excess, Deficit or TwoWay sweeps), retrieve balances,
  transactions and statements, transfer funds, and receive incoming and outgoing wire push
  notifications. Authorization is OAuth 2.0 client_credentials against an Okta token endpoint
  with a Bearer token, account-opening and funds-transfer requests are made idempotent by a
  client-generated GUID requestId, and a client certificate is required for sandbox and
  production connectivity. Portal sign-up is free and self-serve, but the API list, product
  library and every callable environment sit behind sign-in and Global Transaction Services
  sales onboarding, so no OpenAPI, Swagger or AsyncAPI document is publicly downloadable.
