note: >-
  East West Bancorp publishes no API of its own; the group's API surface is the Bridge Open
  Banking program operated by its banking subsidiary, East West Bank, at
  apiportal.eastwestbank.com. No OpenAPI or Swagger document is publicly downloadable — the
  API list, product library and reference render only after portal sign-in — so this profile
  is transcribed from the two pages the provider serves anonymously: the Authorization API
  page (which carries the full token exchange, including the literal token endpoint) and the
  portal FAQ. Nothing here is derived from a securityScheme, because there is no public spec.
