entries:
- version: '1.001'
  date: '2021-06-18'
  title: Bridge Open Banking Release 1.001
  breaking: false
  additions:
  - >-
    Optional "aCHTransactionsAllowed" field added to the Open Sub Account and Update Sub
    Account request and response, controlling which ACH transactions may post to the sub
    account. Permissible values "All", "Debits only", "Credits only", "None"; default "All".
  - >-
    Third sweepType "TwoWay" added to the Open and Update Sub Account APIs, linking the sub
    account to the master account by a two-way collection/disbursement sweep. Default
    sweepType remains "Excess" when not specified.
  - >-
    Optional "pegBalance" field supported on all three sweep types ("Excess", "Deficit",
    "TwoWay") — the maintained balance in the sub account, defaulting to $0. Using pegBalance
    requires passing sweepType in the request.
  - >-
    Open Sub Account and Master/Sub Account Status Inquiry responses now return the Master
    Account Number, so a client can resolve which master account a sub account belongs to.
  changes:
  - >-
    SAM and CAM wire push notifications updated to add country codes to incoming and outgoing
    wire notifications — Originator Country Code, Sending Country Code, Beneficiary Country
    Code.
  fixes:
  - >-
    Error messages returned by certain APIs incorrectly referred to the requestID as a
    transactionID; the nomenclature was corrected.
