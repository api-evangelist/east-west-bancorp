request_id_tracing:
  client_supplied: true
  field: requestId
  note: >-
    requestId doubles as the idempotency key and the client's correlation handle. The June
    2021 release notes record a bug fix in which error messages "incorrectly referred to the
    requestID as a transactionID" — confirming requestId is echoed in error payloads.
  source: https://apiportal.eastwestbank.com/release-notes
